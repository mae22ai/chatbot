{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>형태소 분석 챗봇</title>

<!-- 마크다운 렌더러 + XSS 방지 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { 
    background: #f9f4f4; 
    font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans KR', sans-serif;
    overflow: hidden;        /* ★ 페이지 자체 스크롤 막고 */
  }
  /* 채팅 메시지 컨테이너 - flexbox 사용 */
.chat-container {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 900px;
  margin: 0 auto;
  gap: 10px;
  padding: 12px 16px;
  min-height: 0;
}
.chat-area {
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  min-height: 0;
}
.message-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.message-row.user-row {
  justify-content: flex-end;
}
.profile-img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0; /* 크기 유지를 위해 */
}
.profile-img.user {
  order: 2; /* 사용자 프로필을 메시지 오른쪽으로 이동 */
}

/* 말풍선 공통 */
.message {
  max-width: 70%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 0.96rem;
  line-height: 1.55;
  word-wrap: break-word;
  align-self: flex-start;
}

/* 봇 말풍선 */
.bot {
  background: #ffffff;
  color: #222;
  border: 1px solid #ececec;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
  overflow: hidden;
}
.message.bot .bot-content { display:block; overflow-x:auto; }

/* 사용자 말풍선 */
.user {
  background: #800020;
  color: #fff;
  white-space: pre-wrap;
}

.message-row.user-row .user {
  border-top-right-radius: 4px; /* 사용자 말풍선의 모서리 둥글기 조절 */
}
.message-row.bot-row .bot {
  border-top-left-radius: 4px; /* 챗봇 말풍선의 모서리 둥글기 조절 */
}

  /* 빠른 액션 버튼 */
  .bot-buttons {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .bot-buttons button {
    padding: 6px 12px;
    font-size: 0.9rem;
    background: #fff;
    color: #800020;
    border: 1px solid #800020;
    border-radius: 999px;
    cursor: pointer;
  }
  .bot-buttons button:hover { background: #ffe6ea; }

  /* 하단 입력 컴포저 */
  .composer {
    grid-row: 2;
    display: flex;
    gap: 10px;
    padding: 10px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .composer input[type="text"] {
    flex: 1 1 auto;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 1rem;
    outline: none;
    background: #fff;
  }
  .composer button {
    background: #800020;
    color: #fff;
    border: 0;
    padding: 0 16px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .composer button:disabled { opacity: .6; cursor: not-allowed; }

  /* 마크다운 가독성 */
  .message.bot h1, .message.bot h2, .message.bot h3 { margin: .25rem 0 .5rem }
  .message.bot p { margin: .25rem 0; }
  .message.bot ul, .message.bot ol { margin: .25rem 0 .5rem 1.25rem; }
  .message.bot pre, .message.bot code { white-space: pre-wrap; word-break: break-word; }

  /* 표 스타일 */
  .message.bot table {
    width: 100%;
    border-collapse: collapse;
    margin: .25rem 0;
    border: 1px solid #eee;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }
  .message.bot th, .message.bot td {
    border: 1px solid #eee;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
  }
  .message.bot thead th { background: #f3f4f6; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-area" id="chatArea" aria-live="polite"></div>

  <!-- 폼 아님(기본 GET 제출 X) -->
  <div class="composer">
    <input id="userInput" type="text" placeholder="메시지를 입력하세요..." autocomplete="off" />
    <button id="sendBtn" type="button">전송</button>
  </div>
</div>

<script type="module">
document.addEventListener('DOMContentLoaded', () => {
  const chatArea  = document.getElementById('chatArea');
  const userInput = document.getElementById('userInput');
  const sendBtn   = document.getElementById('sendBtn');

  /* === 스크롤 앵커 & 도우미 === */
  let endAnchor = document.createElement('div');
  endAnchor.style.height = '1px';

  function isNearBottom() {
    const threshold = 80; // px
    return (chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight) <= threshold;
  }

  function scrollToBottom(force = false) {
    if (!force && !isNearBottom()) return; // 위로 올려 보는 중이면 강제 스크롤 X
    if (endAnchor.parentNode !== chatArea) chatArea.appendChild(endAnchor);
    else chatArea.appendChild(endAnchor);
    requestAnimationFrame(() => {
      try { endAnchor.scrollIntoView({ block: 'end', inline: 'nearest' }); }
      catch { chatArea.scrollTop = chatArea.scrollHeight; }
      requestAnimationFrame(() => {
        try { endAnchor.scrollIntoView({ block: 'end', inline: 'nearest' }); }
        catch { chatArea.scrollTop = chatArea.scrollHeight; }
      });
    });
  }

  /* === 유틸 === */
  function safeHTML(unsafe) {
    try { if (window.DOMPurify?.sanitize) return DOMPurify.sanitize(unsafe); } catch(e) {}
    return unsafe;
  }
  
  function addUserMessage(text) {
  const messageRow = document.createElement('div');
  messageRow.className = 'message-row user-row';

  const msg = document.createElement('div');
  msg.className = 'message user';
  msg.textContent = text;

  const profile = document.createElement('img');
  profile.className = 'profile-img user';
  profile.src = `{% static 'images/user_profile.png' %}`;
  profile.alt = '사용자 프로필';

  messageRow.appendChild(msg);
  messageRow.appendChild(profile);
  chatArea.appendChild(messageRow);
  scrollToBottom(true);
}

function addBotText(text) {
    const el = document.createElement('div');
    el.className = 'message bot';
    el.textContent = text;
    chatArea.appendChild(el);
    scrollToBottom(false);
  }

function addBotHTML(html, buttons = [], issueName = null) {
  const messageRow = document.createElement('div');
  messageRow.className = 'message-row bot-row';

  const profile = document.createElement('img');
  profile.className = 'profile-img bot';
  profile.src = `{% static 'images/bot_profile.png' %}`;
  profile.alt = '챗봇 프로필';

  const container = document.createElement('div');
  container.className = 'message bot';

  const wrap = document.createElement('div');
  wrap.className = 'bot-content';
  wrap.innerHTML = html;
  container.appendChild(wrap);

  if (buttons.length || issueName) {
    const btns = document.createElement('div');
    btns.className = 'bot-buttons';
    
    if (issueName) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = '관련 쟁점 설명 더보기';
      b.dataset.issueName = issueName;
      b.classList.add('issue-button'); // Class for event delegation
      btns.appendChild(b);
    }

    buttons.forEach(({text, action}) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = text;
      b.addEventListener('click', action);
      btns.appendChild(b);
    });
    container.appendChild(btns);
  }

  messageRow.appendChild(profile);
  messageRow.appendChild(container);
  chatArea.appendChild(messageRow);
  scrollToBottom(false);
}

  /* === 전송 처리 === */
  userInput.addEventListener('keydown', (e) => {
    if (e.isComposing) return;      // IME 조합 중 Enter 무시
    if (e.key === 'Enter') {
      e.preventDefault();
      handleSend();
    }
  });
  sendBtn.addEventListener('click', handleSend);

  async function handleSend() {
    const text = userInput.value.trim();
    if (!text) return;

    addUserMessage(text);
    userInput.value = '';
    userInput.focus();
    sendBtn.disabled = true;

    const endpoints = ['chat/query']; // 라우팅 차이 방어
    let data = null, lastErr = null;

    for (const ep of endpoints) {
      try {
        const res = await fetch(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
          body: JSON.stringify({ text })
        });
        if (res.ok) { data = await res.json(); break; }
        lastErr = new Error(`HTTP ${res.status}`);
      } catch (e) { lastErr = e; }
    }

    if (!data) {
      addBotText('오류 발생: ' + (lastErr?.message || '네트워크 오류'));
    } else if (data.ok) {
        const botHtml = data.html || (window.marked?.parse ? marked.parse(data.markdown || '') : (data.markdown || ''));
        addBotHTML(safeHTML(botHtml), [], data.issue_found);
    } else if (data.error) {
        addBotText('오류: ' + data.error);
    } else {
        addBotText('알 수 없는 오류가 발생했습니다.');
    }

    sendBtn.disabled = false;

    // 분석 결과 후에 웰컴 메시지와 버튼을 다시 추가합니다.
    addBotHTML(safeHTML("<p>무엇을 도와드릴까요?</p>"), [
      { text: "형태소 분석하기", action: onMorphClick },
      { text: "미정", action: () => addBotText("이 기능은 준비 중이에요!") }
    ]);
  }

  /* === 쟁점 설명 더보기 처리 === */
  chatArea.addEventListener('click', async (e) => {
    if (e.target.matches('.issue-button')) {
        const issueName = e.target.dataset.issueName;
        if (!issueName) return;

        e.target.disabled = true;
        e.target.textContent = '로딩 중...';

        try {
            const res = await fetch(`/issue/${issueName}/`);
            const data = await res.json();

            if (data.ok && data.html) {
                addBotHTML(safeHTML(data.html));
            } else {
                addBotText('쟁점 설명을 불러오는 데 실패했습니다: ' + (data.error || '알 수 없는 오류'));
            }
        } catch (err) {
            addBotText('쟁점 설명을 불러오는 데 실패했습니다: ' + err.message);
        } finally {
            e.target.style.display = 'none'; // 버튼 숨기기
        }
    }
  });

  /* === 초기 웰컴 + 빠른 액션 === */
  addBotHTML(safeHTML("<p>무엇을 도와드릴까요?</p>"), [
    { text: "형태소 분석하기", action: onMorphClick },
    { text: "미정", action: () => addBotText("이 기능은 준비 중이에요!") }
  ]);
  scrollToBottom(true);

  function onMorphClick() {
    addUserMessage("형태소 분석하기");
    addBotHTML(safeHTML("<p>분석할 문장을 입력해주세요!</p>"));
    userInput.placeholder = "예) 집 앞에 있는 나무에 새잎이 돋았다.";
    userInput.focus();
  }
});
</script>
</body>
</html>
