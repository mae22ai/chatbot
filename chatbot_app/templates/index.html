<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>형태소 분석 챗봇</title>

<!-- 마크다운 렌더러 + XSS 방지 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { 
    background: #f9f4f4; 
    font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans KR', sans-serif;
    overflow: hidden;        /* ★ 페이지 자체 스크롤 막고 */
  }
  .chat-container {
    height: 100dvh;
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: 1fr auto;
    gap: 10px;
    padding: 12px 16px;
    min-height: 0;
  }
  .chat-area {
    overflow-y: auto;        /* ★ 여기서만 스크롤 */
    min-height: 0;
  }
  @supports not (height: 100dvh) {
    .chat-container { height: 100vh; }  /* iOS Safari 폴백 */
  }

  /* 말풍선 공통 */
  .message {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 0.96rem;
    line-height: 1.55;
    word-wrap: break-word;
  }

  /* 봇 말풍선 */
  .bot {
    align-self: flex-start;
    background: #ffffff;
    color: #222;
    border: 1px solid #ececec;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    overflow: hidden;
  }
  .message.bot .bot-content { display:block; overflow-x:auto; }

  /* 사용자 말풍선 */
  .user {
    align-self: flex-end;
    background: #800020;
    color: #fff;
    white-space: pre-wrap;
  }

  /* 빠른 액션 버튼 */
  .bot-buttons {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .bot-buttons button {
    padding: 6px 12px;
    font-size: 0.9rem;
    background: #fff;
    color: #800020;
    border: 1px solid #800020;
    border-radius: 999px;
    cursor: pointer;
  }
  .bot-buttons button:hover { background: #ffe6ea; }

  /* 하단 입력 컴포저 */
  .composer {
    grid-row: 2;
    display: flex;
    gap: 10px;
    padding: 10px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .composer input[type="text"] {
    flex: 1 1 auto;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 1rem;
    outline: none;
    background: #fff;
  }
  .composer button {
    background: #800020;
    color: #fff;
    border: 0;
    padding: 0 16px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .composer button:disabled { opacity: .6; cursor: not-allowed; }

  /* 마크다운 가독성 */
  .message.bot h1, .message.bot h2, .message.bot h3 { margin: .25rem 0 .5rem }
  .message.bot p { margin: .25rem 0; }
  .message.bot ul, .message.bot ol { margin: .25rem 0 .5rem 1.25rem; }
  .message.bot pre, .message.bot code { white-space: pre-wrap; word-break: break-word; }

  /* 표 스타일 */
  .message.bot table {
    width: 100%;
    border-collapse: collapse;
    margin: .25rem 0;
    border: 1px solid #eee;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }
  .message.bot th, .message.bot td {
    border: 1px solid #eee;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
  }
  .message.bot thead th { background: #f3f4f6; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-area" id="chatArea" aria-live="polite"></div>

  <!-- 폼 아님(기본 GET 제출 X) -->
  <div class="composer">
    <input id="userInput" type="text" placeholder="메시지를 입력하세요..." autocomplete="off" />
    <button id="sendBtn" type="button">전송</button>
  </div>
</div>

<script type="module">
document.addEventListener('DOMContentLoaded', () => {
  const chatArea  = document.getElementById('chatArea');
  const userInput = document.getElementById('userInput');
  const sendBtn   = document.getElementById('sendBtn');

  /* === 스크롤 앵커 & 도우미 === */
  let endAnchor = document.createElement('div');
  endAnchor.style.height = '1px';

  function isNearBottom() {
    const threshold = 80; // px
    return (chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight) <= threshold;
  }

  function scrollToBottom(force = false) {
    if (!force && !isNearBottom()) return; // 위로 올려 보는 중이면 강제 스크롤 X
    if (endAnchor.parentNode !== chatArea) chatArea.appendChild(endAnchor);
    else chatArea.appendChild(endAnchor);
    requestAnimationFrame(() => {
      try { endAnchor.scrollIntoView({ block: 'end', inline: 'nearest' }); }
      catch { chatArea.scrollTop = chatArea.scrollHeight; }
      requestAnimationFrame(() => {
        try { endAnchor.scrollIntoView({ block: 'end', inline: 'nearest' }); }
        catch { chatArea.scrollTop = chatArea.scrollHeight; }
      });
    });
  }

  /* === 유틸 === */
  function safeHTML(unsafe) {
    try { if (window.DOMPurify?.sanitize) return DOMPurify.sanitize(unsafe); } catch(e) {}
    return unsafe;
  }

  function addUserMessage(text) {
    const msg = document.createElement('div');
    msg.className = 'message user';
    msg.textContent = text;
    chatArea.appendChild(msg);
    scrollToBottom(true); // 내가 보낸 건 바로 바닥
  }

  function addBotText(text) {
    const el = document.createElement('div');
    el.className = 'message bot';
    el.textContent = text;
    chatArea.appendChild(el);
    scrollToBottom(false);
  }

  function addBotHTML(html, buttons = []) {
    const container = document.createElement('div');
    container.className = 'message bot';

    const wrap = document.createElement('div');
    wrap.className = 'bot-content';
    wrap.innerHTML = html; // safeHTML()로 정화된 값만 전달
    container.appendChild(wrap);

    if (buttons.length) {
      const btns = document.createElement('div');
      btns.className = 'bot-buttons';
      buttons.forEach(({text, action}) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = text;
        b.addEventListener('click', action);
        btns.appendChild(b);
      });
      container.appendChild(btns);
    }

    chatArea.appendChild(container);
    scrollToBottom(false);
  }

  /* === 전송 처리 === */
  userInput.addEventListener('keydown', (e) => {
    if (e.isComposing) return;      // IME 조합 중 Enter 무시
    if (e.key === 'Enter') {
      e.preventDefault();
      handleSend();
    }
  });
  sendBtn.addEventListener('click', handleSend);

  async function handleSend() {
    const text = userInput.value.trim();
    if (!text) return;

    addUserMessage(text);
    userInput.value = '';
    userInput.focus();
    sendBtn.disabled = true;

    const endpoints = ['/chat/query', '/chat/query/']; // 라우팅 차이 방어
    let data = null, lastErr = null;

    for (const ep of endpoints) {
      try {
        const res = await fetch(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (res.ok) { data = await res.json(); break; }
        lastErr = new Error(`HTTP ${res.status}`);
      } catch (e) { lastErr = e; }
    }

    if (!data) {
      addBotText('오류 발생: ' + (lastErr?.message || '네트워크 오류'));
      sendBtn.disabled = false;
      return;
    }

    if (data.html) {
      addBotHTML(safeHTML(data.html));
    } else if (data.response || data.markdown) {
      const md = data.markdown || data.response;
      try { marked.setOptions({ gfm: true, breaks: false }); } catch(e){}
      const html = (window.marked?.parse ? marked.parse(md) : md);
      addBotHTML(safeHTML(html));
    } else {
      addBotText('응답 형식을 알 수 없습니다.');
    }

    sendBtn.disabled = false;
  }

  /* === 초기 웰컴 + 빠른 액션 === */
  addBotHTML(safeHTML("<p>무엇을 도와드릴까요?</p>"), [
    { text: "형태소 분석하기", action: onMorphClick },
    { text: "미정", action: () => addBotText("이 기능은 준비 중이에요!") }
  ]);
  scrollToBottom(true);

  function onMorphClick() {
    addUserMessage("형태소 분석하기");
    addBotText("분석할 문장을 입력해주세요!");
    userInput.placeholder = "예) 집 앞에 있는 나무에 새잎이 돋았다.";
    userInput.focus();
  }
});
</script>
</body>
</html>
